# Production-ready Appwrite docker-compose file for Coolify deployment
# Traefik removed - Coolify provides its own reverse proxy
# Note: This compose file does NOT use env_file. 
# All environment variables should be set via Coolify's UI or passed directly.

x-logging: &x-logging
  env_file: []
  logging:
    driver: "json-file"
    options:
      max-file: "5"
      max-size: "10m"

services:
  appwrite:
    container_name: appwrite
    <<: *x-logging
    image: appwrite-prod
    build:
      context: .
      args:
        DEBUG: false
        TESTING: false
        VERSION: 1.0.0
    restart: unless-stopped
    networks:
      - appwrite
    ports:
      - 80
    volumes:
      - appwrite-uploads:/storage/uploads:rw
      - appwrite-imports:/storage/imports:rw
      - appwrite-cache:/storage/cache:rw
      - appwrite-config:/storage/config:rw
      - appwrite-certificates:/storage/certificates:rw
      - appwrite-functions:/storage/functions:rw
      - appwrite-sites:/storage/sites:rw
      - appwrite-builds:/storage/builds:rw
    depends_on:
      - mariadb
      - redis
    entrypoint:
      - php
      - -e
      - app/http.php
    environment:
      - _APP_ENV
      - _APP_EDITION
      - _APP_WORKER_PER_CORE
      - _APP_LOCALE
      - _APP_COMPRESSION_MIN_SIZE_BYTES
      - _APP_CONSOLE_WHITELIST_ROOT
      - _APP_CONSOLE_WHITELIST_EMAILS
      - _APP_CONSOLE_SESSION_ALERTS
      - _APP_CONSOLE_WHITELIST_IPS
      - _APP_CONSOLE_HOSTNAMES
      - _APP_SYSTEM_EMAIL_NAME
